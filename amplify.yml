version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify's settings reach the running site only through this file; exact names, server-only.
        - env | grep -E '^(DATABASE_URL|DATABASE_SSL|DATABASE_SSL_CA_FILE|DATABASE_POOL_MAX|JWT_SECRET|CRON_SECRET|S3_REGION|S3_MEDIA_BUCKET|S3_ARCHIVE_BUCKET|S3_AUDIO_BUCKET|S3_BACKUP_BUCKET|GOOGLE_CLOUD_API_KEY|GEMINI_API_KEY|GEMINI_TTS_MODEL|GEMINI_TTS_VOICE|VOICE_PROVIDER|VOICE_READING_STYLE|HOST_REQUEST_LIMIT_MB|TRUSTED_PROXY_HOPS|STORAGE_LIMIT_MB|NEXT_SERVER_ACTIONS_ENCRYPTION_KEY)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
